# Runs the site and a local Postgres together.
#
#   docker compose up --build          # start (first run builds the image)
#   docker compose down                # stop, keep the database
#   docker compose down -v             # stop and wipe the database
#
# Site: http://localhost:3000   Health: http://localhost:3000/api/health
#
# Optional overrides go in a `.env` file next to this one (Compose reads it
# automatically): POSTGRES_PASSWORD, NEXT_PUBLIC_BOOKING_URL, IP_HASH_SALT.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: site
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: site
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Files here run once, when the database is first created (empty
      # volume), in filename order — so the contact_submissions table exists
      # on first start. For later schema changes on an existing volume, run
      # `npm run db:migrate` (see the README).
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to localhost only, so `npm run db:migrate` and tools like psql
      # can reach it from your machine without exposing it to the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site -d site"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        # Inlined into the browser bundle at build time.
        NEXT_PUBLIC_BOOKING_URL: ${NEXT_PUBLIC_BOOKING_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `db` is the service name above — Compose's internal network resolves it.
      DATABASE_URL: postgres://site:${POSTGRES_PASSWORD:-devpassword}@db:5432/site
      # The Postgres container doesn't speak SSL.
      DATABASE_SSL: "false"
      IP_HASH_SALT: ${IP_HASH_SALT:-}
      LOG_LEVEL: info
    ports:
      - "3000:3000"

volumes:
  pgdata:
